<!doctype html>
<html>
<head>
  <meta charset="utf-8">

  <style>
  
  

  body {
  background-image: url('https://images.pexels.com/photos/1525041/pexels-photo-1525041.jpeg?cs=srgb&dl=pexels-francesco-ungaro-1525041.jpg&fm=jpg');
    height: 100vh; /* force body to be exactly viewport height */
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  ;
font-family: Arial, sans-serif;
color: white;
  text-shadow: 
    -1px -1px 0 black,
     1px -1px 0 black,
    -1px  1px 0 black,
     1px  1px 0 black;
  padding: 50px;
  max-width: 700px;
  margin: auto;
  color: white; /* this makes all text white */

label {
  display: block;   /* ensures each label takes a full line */
  margin: 10px 0;   /* spacing between labels */
}
input {
  display: block;   /* ensures each input stays on its own line */
  width: 100%;      /* fills parent container */
  padding: 6px;
  box-sizing: border-box;
  margin-top: 5px;  /* space between label text and input box */
}

}
  </style>
</head>
<body>
  
  
  
  
  
  <h1>Sign In </h1>
  <p class="notice">Almost there... On ur way to Discovery.</p>

  <form action="/submit" method="POST">
    <label>
      Username:
      <input name="username" autocomplete="off" required>
    </label>

    <label>
      Password:
      <input name="password" autocomplete="off" required>
    </label>

    <label>
      Notes: (optional)
      <input name="notes" placeholder="e.g. 'Hello There'">
    </label>

    <label>
      Adress: (optional)
      <input name="Adress" placeholder="e.g. 'Texas - America'">
    </label>

    <button type="Submit">Sign In</button>
  </form>
